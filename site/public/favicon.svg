<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- readouts: a stack of knowledge bases; the front one is a readout of entries.
       Two entries carry a verified check, one waits on a verdict (amber). -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="#141a28"/>

  <!-- the stack behind -->
  <rect x="196" y="150" width="700" height="600" rx="60" ry="60" fill="#18203a" stroke="#22406a" stroke-width="6"/>
  <rect x="158" y="195" width="720" height="620" rx="62" ry="62" fill="#1a2238" stroke="#1f5f86" stroke-width="6"/>

  <!-- the front readout -->
  <rect x="112" y="244" width="744" height="640" rx="64" ry="64" fill="#1c253a" stroke="#22d3ee" stroke-width="8"/>

  <!-- row 1: verified -->
  <circle cx="236" cy="384" r="50" fill="#22d3ee"/>
  <path d="M213 386 L229 402 L261 369" fill="none" stroke="#141a28" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="344" width="440" height="80" rx="40" ry="40" fill="#e2e8f0"/>

  <!-- row 2: verified -->
  <circle cx="236" cy="564" r="50" fill="#22d3ee"/>
  <path d="M213 566 L229 582 L261 549" fill="none" stroke="#141a28" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="524" width="360" height="80" rx="40" ry="40" fill="#e2e8f0"/>

  <!-- row 3: waiting on a verdict -->
  <circle cx="236" cy="744" r="50" fill="#f59e0b"/>
  <rect x="213" y="736" width="46" height="16" rx="8" ry="8" fill="#141a28"/>
  <rect x="322" y="704" width="270" height="80" rx="40" ry="40" fill="#64748b"/>
</svg>
