# Chroma LoRA dataset — same cyanotype set + reg set as the SDXL runs, for an apples-to-apples base comparison.
# train subset: cyanotype, captions "stdstyl, <subject>" (trigger carries the style)
# reg subset:   normal color, captions "<subject>" (no trigger) -> prior-preservation gating
[general]
caption_extension = ".txt"
shuffle_caption = false

[[datasets]]
resolution = 1024
batch_size = 1
enable_bucket = false

  [[datasets.subsets]]
  image_dir = "E:/AI/training/dataset_stdstyl/10_neutralset"
  num_repeats = 10

  [[datasets.subsets]]
  image_dir = "E:/AI/training/reg_stdstyl/10_object"
  num_repeats = 10
  is_reg = true
