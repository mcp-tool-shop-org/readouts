summary: ""
boundaries:
  - name: .claude
    globs:
      - .claude/**
    role: data
  - name: .github
    globs:
      - .github/**
    role: config
  - name: blender-knowledge
    globs:
      - blender-knowledge/**
    role: config
  - name: docker-knowledge
    globs:
      - docker-knowledge/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: godot-knowledge
    globs:
      - godot-knowledge/**
    role: config
  - name: model-knowledge
    globs:
      - model-knowledge/**
    role: config
  - name: oracle
    globs:
      - rust-knowledge/oracle/**
    role: code
  - name: oracle-jam
    globs:
      - rust-knowledge/oracle-jam/**
    role: code
  - name: oracle-jam-strict
    globs:
      - rust-knowledge/oracle-jam-strict/**
    role: code
  - name: root
    globs:
      - "*"
    role: docs
  - name: rust-knowledge
    globs:
      - rust-knowledge/*
      - rust-knowledge/.claude/**
      - rust-knowledge/briefs/**
      - rust-knowledge/catalog/**
      - rust-knowledge/readout/**
      - rust-knowledge/scripts/**
      - rust-knowledge/verification/**
      - rust-knowledge/waves/**
    role: config
  - name: shared
    globs:
      - shared/**
    role: code
  - name: site
    globs:
      - site/**
    role: site
  - name: sprite-motion-knowledge
    globs:
      - sprite-motion-knowledge/**
    role: config
  - name: sprites-knowledge
    globs:
      - sprites-knowledge/**
    role: config
  - name: tensor-engine-knowledge
    globs:
      - tensor-engine-knowledge/**
    role: code
  - name: training-knowledge
    globs:
      - training-knowledge/**
    role: docs
  - name: vocology-knowledge
    globs:
      - vocology-knowledge/**
    role: config
  - name: xrpl-knowledge
    globs:
      - xrpl-knowledge/**
    role: docs
