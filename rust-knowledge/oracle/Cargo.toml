# rust-knowledge compile oracle — the dependency set a recipe's check may link.
#
# Not a product crate. `scripts/compile_oracle.py setup` builds these once; each
# check then compiles with plain rustc and `--extern name=<rlib>` against the
# built artifacts, so concurrent checks never contend for a cargo lock.
#
# rapier3d-f64 is pinned to the exact version si-rpg-engine's solver links, with
# the same feature, and Cargo.lock starts from the solver's lockfile so rapier's
# tree resolves identically.
[package]
name = "rk-oracle"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rapier3d-f64 = { version = "=0.35.3", features = ["enhanced-determinism"] }
parry3d-f64 = "=0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1.0.104"
libm = "0.2.16"
bytemuck = { version = "1.25.2", features = ["derive"] }
slotmap = "1.1.1"
indexmap = "2.14.2"
smallvec = "1.16.2"
arrayvec = "0.7.8"
xxhash-rust = { version = "0.8.18", features = ["xxh3", "xxh64"] }
proptest = "1.11.0"
wasmparser = "0.259.0"
