# The si-jam-sessions law's own midly configuration (Phase 0 pins alloc + strict). A check
# selects it with "oracle_set": "jam-strict". It is a separate crate because cargo unifies
# features within one build: adding "strict" to ../oracle-jam would silently change what
# every wave-4 midly check measured. Built for the host AND wasm32-unknown-unknown.
[package]
name = "rust-knowledge-oracle-jam-strict"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
midly = { version = "=0.5.3", default-features = false, features = ["alloc", "strict"] }
