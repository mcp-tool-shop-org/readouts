# The si-jam-sessions tier's dependency set (wave 4). A check selects it with "oracle": "jam".
# It is separate from ../oracle (the engine's set), which it never changes.
# The top block is built for the host AND wasm32-unknown-unknown; the target block is host-only
# (audio and MIDI devices, real-time queues), because those crates target an OS, not the law.
[package]
name = "rust-knowledge-oracle-jam"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
midly = { version = "=0.5.3", default-features = false, features = ["alloc"] }
quick-xml = "=0.42.0"
roxmltree = "=0.21.1"
musicxml = "=1.1.2"
abc-parser = "=0.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "=0.18.2"
midir = "=0.11.0"
rtrb = "=0.4.0"
ringbuf = "=0.5.2"
assert_no_alloc = "=1.1.2"
